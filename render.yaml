services:
  - type: web
    name: interpreter-finance
    runtime: docker
    dockerfilePath: ./interpreter-finance/Dockerfile
    dockerContext: ./interpreter-finance
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true